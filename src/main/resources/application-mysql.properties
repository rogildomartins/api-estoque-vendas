spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:estoque}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:estoque}
spring.datasource.password=${DB_PASSWORD:estoque}
spring.h2.console.enabled=false

# Em produção não carregamos os dados de exemplo.
spring.flyway.locations=classpath:db/migration
