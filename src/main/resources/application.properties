spring.application.name=api-estoque-vendas

# Perfil padrão: banco H2 em memória (roda sem instalar nada).
# Para usar MySQL: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:estoque;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# O schema é controlado pelo Flyway; o Hibernate apenas valida se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/dados-exemplo

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
